version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AIR_GAPPED_MODE=${AIR_GAPPED_MODE:-false}
      - TRONGRID_API_KEY=${TRONGRID_API_KEY:-}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
    volumes:
      - cryptotrace_data:/app/data
    networks:
      - cryptotrace_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cryptotrace_net

volumes:
  cryptotrace_data:

networks:
  cryptotrace_net:
    driver: bridge
